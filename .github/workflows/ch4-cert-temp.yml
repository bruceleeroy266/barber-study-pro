name: Chapter 4 Temporary Certification

on:
  push:
    branches:
      - ch4-content-foundation

jobs:
  certify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-build
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key-for-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Chapter 4 integrity
        run: npx vitest run src/lib/chapter-4-concepts/integrity.test.ts
      - name: Chapter 2 and Chapter 3 regression
        run: npx vitest run src/lib/chapter-2-concepts src/lib/chapter-3-concepts
      - name: Full Vitest
        run: npm test
        continue-on-error: true
      - name: Production build with placeholder environment
        run: npm run build
