name: CRUD-37 Isolated Auth Security
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: crud37-isolated-auth
  cancel-in-progress: false
jobs:
  authenticated-isolation:
    runs-on: ubuntu-latest
    environment: ascyn-isolated-security-qa
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate isolated target and secrets without printing values
        env:
          ASCYN_TEST_URL: ${{ secrets.ASCYN_TEST_URL }}
          ASCYN_TEST_ANON_KEY: ${{ secrets.ASCYN_TEST_ANON_KEY }}
          ASCYN_TEST_SERVICE_KEY: ${{ secrets.ASCYN_TEST_SERVICE_KEY }}
        run: |
          test -n "$ASCYN_TEST_URL" && test -n "$ASCYN_TEST_ANON_KEY" && test -n "$ASCYN_TEST_SERVICE_KEY"
          test "$ASCYN_TEST_URL" = "https://iarbvjfueumrengsgabx.supabase.co"
      - name: Execute genuine JWT and retention checks
        env:
          ASCYN_TEST_URL: ${{ secrets.ASCYN_TEST_URL }}
          ASCYN_TEST_ANON_KEY: ${{ secrets.ASCYN_TEST_ANON_KEY }}
          ASCYN_TEST_SERVICE_KEY: ${{ secrets.ASCYN_TEST_SERVICE_KEY }}
          ASCYN_ALLOW_DISPOSABLE_WRITES: yes
        run: node scripts/security/crud35-auth-isolation.mjs
